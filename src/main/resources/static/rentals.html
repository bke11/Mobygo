<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>My Rentals – MobyGo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="/css/style.css" rel="stylesheet"/>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="navbar-brand" href="/"><i class="bi bi-car-front-fill me-1"></i>Moby<span>Go</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/">Cars</a></li>
        <li class="nav-item"><a class="nav-link" href="/locations.html">Locations</a></li>
        <li class="nav-item"><a class="nav-link active" href="/rentals.html">My Rentals</a></li>
        <li class="nav-item d-none" id="adminLink"><a class="nav-link" href="/admin.html">Admin</a></li>
      </ul>
      <div class="d-flex align-items-center gap-2">
        <span class="text-white-50 small" id="userInfo"></span>
        <button class="btn btn-outline-light btn-sm" id="loginBtn" data-bs-toggle="modal" data-bs-target="#loginModal">Login</button>
        <button class="btn btn-outline-light btn-sm d-none" id="logoutBtn" onclick="logout()">Logout</button>
      </div>
    </div>
  </div>
</nav>

<div class="container py-4">

  <!-- Login required banner -->
  <div id="loginRequired" class="text-center py-5 d-none">
    <i class="bi bi-lock-fill display-3 text-muted d-block mb-3"></i>
    <h4>Login required</h4>
    <p class="text-muted">Please log in to view and create rentals.</p>
    <button class="btn btn-mg" data-bs-toggle="modal" data-bs-target="#loginModal">
      <i class="bi bi-box-arrow-in-right me-1"></i>Login
    </button>
  </div>

  <!-- Logged-in content -->
  <div id="mainContent" class="d-none">
    <div class="row g-4">

      <!-- Book a Car -->
      <div class="col-12 col-lg-4">
        <div class="card">
          <div class="card-header bg-white">
            <h5 class="section-title mb-0">Book a Car</h5>
          </div>
          <div class="card-body">
            <div id="bookingError" class="alert alert-danger d-none small"></div>
            <div id="bookingSuccess" class="alert alert-success d-none small"></div>
            <div class="mb-3">
              <label class="form-label">Car</label>
              <select id="bookCar" class="form-select"></select>
            </div>
            <div class="mb-3">
              <label class="form-label">Pickup Location</label>
              <select id="bookPickup" class="form-select"></select>
            </div>
            <div class="mb-3">
              <label class="form-label">Dropoff Location</label>
              <select id="bookDropoff" class="form-select"></select>
            </div>
            <div class="row g-2 mb-3">
              <div class="col">
                <label class="form-label">Start Date</label>
                <input type="date" id="bookStart" class="form-control" onchange="calcPrice()"/>
              </div>
              <div class="col">
                <label class="form-label">End Date</label>
                <input type="date" id="bookEnd" class="form-control" onchange="calcPrice()"/>
              </div>
            </div>
            <div id="pricePreview" class="alert alert-info d-none small mb-3"></div>
            <button class="btn btn-mg w-100" onclick="createRental()">
              <i class="bi bi-calendar-check me-1"></i>Confirm Booking
            </button>
          </div>
        </div>
      </div>

      <!-- My Rentals list -->
      <div class="col-12 col-lg-8">
        <h4 class="section-title mb-3">My Bookings</h4>
        <div id="rentalsList">
          <div class="text-center py-4"><div class="spinner-border text-primary"></div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Login Modal -->
<div class="modal fade" id="loginModal" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-lock-fill me-2"></i>Login</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="loginError" class="alert alert-danger d-none small"></div>
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" id="loginUser" class="form-control"/>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" id="loginPass" class="form-control"/>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-mg w-100" onclick="doLogin()">Sign In</button>
      </div>
    </div>
  </div>
</div>

<div id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script>
  const DAILY_RATES = { ECONOMY:50, COMPACT:80, SUV:120, LUXURY:200, VAN:100 };
  let carsData = [], locationsData = [], userId = null;

  updateNavAuth();
  checkAuth();

  function checkAuth() {
    if (Auth.isLoggedIn()) {
      document.getElementById('loginRequired').classList.add('d-none');
      document.getElementById('mainContent').classList.remove('d-none');
      loadFormData();
      loadMyRentals();
    } else {
      document.getElementById('loginRequired').classList.remove('d-none');
      document.getElementById('mainContent').classList.add('d-none');
    }
  }

  async function loadFormData() {
    const [cars, locations, users] = await Promise.all([
      API.get('/cars'), API.get('/locations'), API.get('/users')
    ]);
    carsData = cars;
    locationsData = locations;
    const me = users.find(u => u.username === Auth.getUsername());
    if (me) userId = me.id;

    const carSel = document.getElementById('bookCar');
    cars.forEach(c => {
      const o = document.createElement('option');
      o.value = c.id;
      o.textContent = `${c.brand} ${c.model} (${c.category})`;
      o.dataset.category = c.category;
      carSel.appendChild(o);
    });

    ['bookPickup','bookDropoff'].forEach(id => {
      const sel = document.getElementById(id);
      locations.forEach(l => {
        const o = document.createElement('option');
        o.value = l.id; o.textContent = l.name;
        sel.appendChild(o);
      });
    });

    // Default dates
    const today = new Date();
    const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate()+1);
    const dayAfter = new Date(today); dayAfter.setDate(dayAfter.getDate()+3);
    document.getElementById('bookStart').value = tomorrow.toISOString().split('T')[0];
    document.getElementById('bookEnd').value   = dayAfter.toISOString().split('T')[0];
    calcPrice();
  }

  function calcPrice() {
    const carSel = document.getElementById('bookCar');
    const cat = carSel.selectedOptions[0]?.dataset.category;
    const start = document.getElementById('bookStart').value;
    const end   = document.getElementById('bookEnd').value;
    const preview = document.getElementById('pricePreview');
    if (!cat || !start || !end) return;
    const days = Math.round((new Date(end) - new Date(start)) / 86400000);
    if (days <= 0) { preview.classList.add('d-none'); return; }
    const price = days * (DAILY_RATES[cat] || 80);
    preview.textContent = `Estimated price: CHF ${price} (${days} day${days>1?'s':''} × CHF ${DAILY_RATES[cat]}/day)`;
    preview.classList.remove('d-none');
  }

  document.getElementById('bookCar')?.addEventListener('change', calcPrice);

  async function loadMyRentals() {
    try {
      const rentals = await API.get(`/rentals/user/${Auth.getUsername()}`);
      renderRentals(rentals);
    } catch (e) {
      document.getElementById('rentalsList').innerHTML =
        `<div class="alert alert-danger">${e.message}</div>`;
    }
  }

  function renderRentals(rentals) {
    const el = document.getElementById('rentalsList');
    if (!rentals.length) {
      el.innerHTML = '<div class="text-center text-muted py-4"><i class="bi bi-calendar-x display-4 d-block mb-2"></i>No bookings yet</div>';
      return;
    }
    el.innerHTML = rentals.map(r => `
      <div class="card mb-3 rental-card">
        <div class="card-body">
          <div class="row align-items-center">
            <div class="col-auto">
              <i class="bi bi-car-front-fill fs-3 text-primary"></i>
            </div>
            <div class="col">
              <h6 class="mb-1">${r.car?.brand || ''} ${r.car?.model || ''}</h6>
              <small class="text-muted">
                <i class="bi bi-calendar me-1"></i>${r.startDate} → ${r.endDate}
              </small><br>
              <small class="text-muted">
                <i class="bi bi-geo-alt me-1"></i>${r.pickupLocation?.name || ''} → ${r.dropoffLocation?.name || ''}
              </small>
            </div>
            <div class="col-auto text-end">
              <div class="price-tag">CHF ${r.totalPrice}</div>
              <small class="text-muted">total</small>
            </div>
          </div>
        </div>
      </div>`).join('');
  }

  async function createRental() {
    const errEl = document.getElementById('bookingError');
    const okEl  = document.getElementById('bookingSuccess');
    errEl.classList.add('d-none');
    okEl.classList.add('d-none');

    try {
      const rental = await API.post('/rentals', {
        carId:              parseInt(document.getElementById('bookCar').value),
        pickupLocationId:   parseInt(document.getElementById('bookPickup').value),
        dropoffLocationId:  parseInt(document.getElementById('bookDropoff').value),
        userId:             userId,
        startDate:          document.getElementById('bookStart').value,
        endDate:            document.getElementById('bookEnd').value
      });
      okEl.textContent = `Booking confirmed! Total: CHF ${rental.totalPrice}`;
      okEl.classList.remove('d-none');
      showToast('Booking confirmed!');
      loadMyRentals();
    } catch (e) {
      errEl.textContent = e.message;
      errEl.classList.remove('d-none');
    }
  }

  async function doLogin() {
    const username = document.getElementById('loginUser').value.trim();
    const password = document.getElementById('loginPass').value;
    const errEl = document.getElementById('loginError');
    errEl.classList.add('d-none');
    try {
      Auth.save(username, password);
      const users = await API.get('/users');
      const me = users.find(u => u.username === username);
      if (me) sessionStorage.setItem('mg_role', me.role);
      bootstrap.Modal.getInstance(document.getElementById('loginModal')).hide();
      updateNavAuth();
      checkAuth();
      showToast(`Welcome, ${username}!`);
    } catch (e) {
      Auth.clear();
      errEl.textContent = 'Invalid username or password';
      errEl.classList.remove('d-none');
    }
  }

  // Handle ?carId= from Cars page
  const params = new URLSearchParams(location.search);
  if (params.get('carId')) {
    window.addEventListener('load', () => {
      const sel = document.getElementById('bookCar');
      if (sel) sel.value = params.get('carId');
    });
  }
</script>
</body>
</html>
